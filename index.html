<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pace Notes - Live</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Setup Overlay -->
  <div id="setup-overlay">
    <div class="setup-content">
      <h1>&#127937; Pace Notes</h1>
      <p>Live road curvature guidance using GPS</p>
      <div id="saved-key-notice" style="display: none; margin-bottom: 16px;">
        <div style="background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; border-radius: 8px; padding: 12px; margin-bottom: 12px;">
          <div style="color: #22c55e; font-size: 13px;">&#10003; API key saved</div>
          <div id="masked-key" style="font-family: monospace; font-size: 12px; color: #888; margin-top: 4px;"></div>
        </div>
        <button id="use-saved-btn" onclick="useSavedKey()" style="width: 100%; padding: 16px; border-radius: 12px; border: none; background: #22c55e; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px;">Continue with Saved Key</button>
        <button id="change-key-btn" onclick="showKeyInput()" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #333; background: transparent; color: #888; font-size: 14px; cursor: pointer;">Change API Key</button>
      </div>
      <div id="key-input-section">
        <input type="text" id="api-key-input" placeholder="Enter your Mapbox API key">
        <button id="setup-btn" onclick="initializeApp()">Start App</button>
      </div>
      <a href="https://account.mapbox.com/access-tokens/" target="_blank">Get a free Mapbox API key &#8594;</a>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Approach Glow -->
  <div id="approach-glow"></div>

  <!-- GPS Accuracy -->
  <div id="gps-accuracy" style="display: none;">
    <div class="gps-dot good"></div>
    <span id="accuracy-text">GPS</span>
    <span id="wake-lock-indicator" title="Screen wake lock"></span>
  </div>

  <!-- Session Stats -->
  <div id="session-stats">
    <div class="stat-row"><span class="label">DIST</span><span class="val" id="session-dist">0.0 mi</span></div>
    <div class="stat-row"><span class="label">TIME</span><span class="val" id="session-time">0:00</span></div>
    <div class="stat-row"><span class="label">TURNS</span><span class="val" id="session-turns">0</span></div>
    <div class="stat-row"><span class="label">TOP</span><span class="val" id="session-top">0 mph</span></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="pace-display">
      <div id="current-call">
        <div id="distance-to-call">&#8212;</div>
        <div id="call-text">Waiting for GPS...</div>
        <div id="call-description"></div>
      </div>
      <div id="upcoming-strip"></div>
    </div>
  </div>

  <!-- Status -->
  <div id="status">
    <div id="status-text">Acquiring GPS...</div>
  </div>

  <!-- Legend -->
  <div id="legend">
    <div class="legend-row"><div class="legend-dot" style="background:#ef4444"></div> 1-2 Hairpin/Tight</div>
    <div class="legend-row"><div class="legend-dot" style="background:#eab308"></div> 3-4 Medium</div>
    <div class="legend-row"><div class="legend-dot" style="background:#22c55e"></div> 5-6 Fast/Flat</div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <div id="stats-row">
      <div class="stat-box">
        <div class="stat-value" id="speed-value">0</div>
        <div class="stat-label">MPH</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="heading-value">&#8212;</div>
        <div class="stat-label">heading</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="curves-value">0</div>
        <div class="stat-label">curves ahead</div>
      </div>
    </div>
    <div id="button-row">
      <button id="start-btn" class="start" onclick="toggleTracking()">
        <span>&#9654;</span> Start
      </button>
      <button id="demo-btn" onclick="toggleDemo()">
        <span>&#127916;</span> Demo
      </button>
      <button id="sound-btn" onclick="toggleSound()">&#128266;</button>
      <button id="refresh-btn" onclick="refreshRoute()">&#8635;</button>
      <button id="record-btn" onclick="toggleRecording()">&#9210;</button>
      <button id="center-btn" onclick="centerOnUser()">&#9678;</button>
      <button id="settings-btn" onclick="openSettings()">&#9881;</button>
    </div>
  </div>

  <!-- JavaScript modules (load order matters) -->
  <script src="js/state.js"></script>
  <script src="js/map.js"></script>
  <script src="js/curves.js"></script>
  <script src="js/recording.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/demo.js"></script>
  <script>
    // Initialize DOM references and event listeners once DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize DOM element references (defined in state.js)
      initDOMRefs();

      // Check for saved API key
      checkSavedKey();

      // Attach iOS speech unlock to all buttons
      document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', unlockSpeech, { once: false });
      });
    });

    // Re-acquire wake lock when tab becomes visible again (iOS releases it on tab switch)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && (isTracking || isDemoMode)) {
        requestWakeLock();
      }
    });
  </script>
</body>
</html>
