<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pace Notes - Live</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: white;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Setup overlay */
    #setup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.98);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #setup-overlay.hidden {
      display: none;
    }

    .setup-content {
      max-width: 400px;
      text-align: center;
    }

    .setup-content h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .setup-content p {
      color: #888;
      margin-bottom: 24px;
    }

    .setup-content input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a24;
      color: white;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .setup-content input::placeholder {
      color: #666;
    }

    .setup-content button {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .setup-content button:disabled {
      background: #333;
      color: #666;
    }

    .setup-content a {
      color: #60a5fa;
      font-size: 13px;
      display: block;
      margin-top: 16px;
    }

    /* Main HUD */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      pointer-events: none;
    }

    #pace-display {
      background: linear-gradient(to bottom, rgba(10, 10, 15, 0.95), rgba(10, 10, 15, 0.8));
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    #current-call {
      text-align: center;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #distance-to-call {
      font-size: 48px;
      font-weight: 800;
      font-family: 'SF Mono', 'Menlo', monospace;
      line-height: 1;
    }

    #call-text {
      font-size: 32px;
      font-weight: 700;
      margin-top: 8px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    #call-description {
      font-size: 14px;
      color: #888;
      margin-top: 4px;
    }

    .severity-1 { color: #ef4444; }
    .severity-2 { color: #f97316; }
    .severity-3 { color: #eab308; }
    .severity-4 { color: #84cc16; }
    .severity-5 { color: #22c55e; }
    .severity-6 { color: #34d399; }

    /* Upcoming notes */
    #upcoming-strip {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    #upcoming-strip::-webkit-scrollbar {
      display: none;
    }

    .upcoming-note {
      flex-shrink: 0;
      background: rgba(30, 30, 40, 0.9);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      backdrop-filter: blur(10px);
    }

    .upcoming-note .dist {
      color: #666;
      font-size: 11px;
    }

    /* Bottom controls */
    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(10, 10, 15, 0.95), transparent);
      z-index: 100;
      pointer-events: none;
    }

    #controls > * {
      pointer-events: auto;
    }

    #stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: rgba(30, 30, 40, 0.9);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      font-family: 'SF Mono', monospace;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #button-row {
      display: flex;
      gap: 12px;
    }

    #start-btn, #demo-btn {
      flex: 1;
      padding: 18px;
      border-radius: 14px;
      border: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    #start-btn.start, #demo-btn {
      background: #22c55e;
      color: white;
    }

    #demo-btn {
      background: #8b5cf6;
    }

    #demo-btn.active {
      background: #ef4444;
    }

    #start-btn.stop {
      background: #ef4444;
      color: white;
    }

    #sound-btn, #center-btn, #settings-btn {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      border: none;
      background: rgba(50, 50, 60, 0.9);
      color: white;
      font-size: 24px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    #sound-btn.muted {
      color: #666;
    }

    #settings-btn {
      font-size: 20px;
    }

    /* Status messages */
    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 30, 40, 0.95);
      padding: 20px 30px;
      border-radius: 16px;
      text-align: center;
      z-index: 200;
      backdrop-filter: blur(20px);
      display: none;
    }

    #status.visible {
      display: block;
    }

    /* Legend */
    #legend {
      position: fixed;
      bottom: 180px;
      left: 20px;
      background: rgba(20, 20, 30, 0.9);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 11px;
      z-index: 90;
      backdrop-filter: blur(10px);
      display: none;
    }

    #legend.visible {
      display: block;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    /* GPS accuracy indicator */
    #gps-accuracy {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      right: 20px;
      background: rgba(30, 30, 40, 0.9);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 110;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gps-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .gps-dot.good { background: #22c55e; }
    .gps-dot.medium { background: #eab308; }
    .gps-dot.poor { background: #ef4444; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <!-- Setup Overlay -->
  <div id="setup-overlay">
    <div class="setup-content">
      <h1>🏁 Pace Notes</h1>
      <p>Live road curvature guidance using GPS</p>
      <div id="saved-key-notice" style="display: none; margin-bottom: 16px;">
        <div style="background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; border-radius: 8px; padding: 12px; margin-bottom: 12px;">
          <div style="color: #22c55e; font-size: 13px;">✓ API key saved</div>
          <div id="masked-key" style="font-family: monospace; font-size: 12px; color: #888; margin-top: 4px;"></div>
        </div>
        <button id="use-saved-btn" onclick="useSavedKey()" style="width: 100%; padding: 16px; border-radius: 12px; border: none; background: #22c55e; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px;">Continue with Saved Key</button>
        <button id="change-key-btn" onclick="showKeyInput()" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #333; background: transparent; color: #888; font-size: 14px; cursor: pointer;">Change API Key</button>
      </div>
      <div id="key-input-section">
        <input type="text" id="api-key-input" placeholder="Enter your Mapbox API key">
        <button id="setup-btn" onclick="initializeApp()">Start App</button>
      </div>
      <a href="https://account.mapbox.com/access-tokens/" target="_blank">Get a free Mapbox API key →</a>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- GPS Accuracy -->
  <div id="gps-accuracy" style="display: none;">
    <div class="gps-dot good"></div>
    <span id="accuracy-text">GPS</span>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="pace-display">
      <div id="current-call">
        <div id="distance-to-call">—</div>
        <div id="call-text">Waiting for GPS...</div>
        <div id="call-description"></div>
      </div>
      <div id="upcoming-strip"></div>
    </div>
  </div>

  <!-- Status -->
  <div id="status">
    <div id="status-text">Acquiring GPS...</div>
  </div>

  <!-- Legend -->
  <div id="legend">
    <div class="legend-row"><div class="legend-dot" style="background:#ef4444"></div> 1-2 Hairpin/Tight</div>
    <div class="legend-row"><div class="legend-dot" style="background:#eab308"></div> 3-4 Medium</div>
    <div class="legend-row"><div class="legend-dot" style="background:#22c55e"></div> 5-6 Fast/Flat</div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <div id="stats-row">
      <div class="stat-box">
        <div class="stat-value" id="speed-value">0</div>
        <div class="stat-label">MPH</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="heading-value">—</div>
        <div class="stat-label">heading</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="curves-value">0</div>
        <div class="stat-label">curves ahead</div>
      </div>
    </div>
    <div id="button-row">
      <button id="start-btn" class="start" onclick="toggleTracking()">
        <span>▶</span> Start
      </button>
      <button id="demo-btn" onclick="toggleDemo()">
        <span>🎬</span> Demo
      </button>
      <button id="sound-btn" onclick="toggleSound()">🔊</button>
      <button id="center-btn" onclick="centerOnUser()">◎</button>
      <button id="settings-btn" onclick="openSettings()">⚙</button>
    </div>
  </div>

  <script>
    // State
    let map = null;
    let mapboxToken = '';
    let isTracking = false;
    let soundEnabled = true;
    let watchId = null;
    let currentPosition = null;
    let currentSpeed = 0;
    let currentHeading = 0;
    let lastFetchPosition = null;
    let lastFetchHeading = null;
    let lastFetchTime = 0;
    let upcomingCurves = [];
    let lastSpokenCurve = null;
    let routeCoordinates = [];
    let userMarker = null;
    let curveMarkers = [];
    let routeLine = null;
    let positionHistory = [];
    const POSITION_HISTORY_MAX = 10;
    const REFETCH_DISTANCE_M = 50;
    const REFETCH_HEADING_DEG = 25;
    const REFETCH_INTERVAL_MS = 10000;
    const LOOK_AHEAD_KM = 2;

    // Demo mode state
    let isDemoMode = false;
    let demoInterval = null;
    let demoIndex = 0;
    let demoSpeed = 45; // MPH
    let demoRouteData = []; // Will be populated from Mapbox

    // Demo route: Pikes Peak Hill Climb section (Colorado)
    const DEMO_START = [-105.0675561764574, 38.86176996714182];
    const DEMO_END = [-105.04432838005656, 38.8397878232719];

    // DOM elements
    const distanceEl = document.getElementById('distance-to-call');
    const callTextEl = document.getElementById('call-text');
    const callDescEl = document.getElementById('call-description');
    const upcomingEl = document.getElementById('upcoming-strip');
    const speedEl = document.getElementById('speed-value');
    const headingEl = document.getElementById('heading-value');
    const curvesEl = document.getElementById('curves-value');
    const startBtn = document.getElementById('start-btn');
    const soundBtn = document.getElementById('sound-btn');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const gpsAccuracy = document.getElementById('gps-accuracy');
    const accuracyText = document.getElementById('accuracy-text');
    const gpsDot = document.querySelector('.gps-dot');
    const legend = document.getElementById('legend');

    // Initialize app with API key
    function initializeApp() {
      const keyInput = document.getElementById('api-key-input');
      mapboxToken = keyInput.value.trim();

      if (!mapboxToken) {
        alert('Please enter your Mapbox API key');
        return;
      }

      localStorage.setItem('mapboxToken', mapboxToken);
      document.getElementById('setup-overlay').classList.add('hidden');
      initMap();
    }

    // Check for saved API key
    function checkSavedKey() {
      const saved = localStorage.getItem('mapboxToken');
      if (saved) {
        // Show saved key notice
        document.getElementById('saved-key-notice').style.display = 'block';
        document.getElementById('key-input-section').style.display = 'none';
        document.getElementById('masked-key').textContent = maskApiKey(saved);
      }
    }

    // Use the saved API key
    function useSavedKey() {
      const saved = localStorage.getItem('mapboxToken');
      if (saved) {
        mapboxToken = saved;
        document.getElementById('setup-overlay').classList.add('hidden');
        initMap();
      }
    }

    // Show the key input form to change key
    function showKeyInput() {
      document.getElementById('saved-key-notice').style.display = 'none';
      document.getElementById('key-input-section').style.display = 'block';
      document.getElementById('api-key-input').value = '';
      document.getElementById('api-key-input').focus();
    }

    // Open settings overlay
    function openSettings() {
      // Stop tracking if active
      if (isTracking) {
        stopTracking();
      }

      const saved = localStorage.getItem('mapboxToken');
      if (saved) {
        document.getElementById('saved-key-notice').style.display = 'block';
        document.getElementById('key-input-section').style.display = 'none';
        document.getElementById('masked-key').textContent = maskApiKey(saved);
      } else {
        document.getElementById('saved-key-notice').style.display = 'none';
        document.getElementById('key-input-section').style.display = 'block';
      }

      document.getElementById('setup-overlay').classList.remove('hidden');
    }

    // Mask API key for display
    function maskApiKey(key) {
      if (key.length <= 8) return '••••••••';
      return key.substring(0, 4) + '••••••••' + key.substring(key.length - 4);
    }

    // Initialize Mapbox
    function initMap() {
      mapboxgl.accessToken = mapboxToken;

      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/navigation-night-v1',
        center: [0, 0],
        zoom: 17,
        pitch: 70,
        bearing: 0
      });

      map.addControl(new mapboxgl.NavigationControl(), 'top-left');

      map.on('load', () => {
        // Add route line source
        map.addSource('route', {
          type: 'geojson',
          data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
        });

        map.addLayer({
          id: 'route-line',
          type: 'line',
          source: 'route',
          paint: {
            'line-color': '#3b82f6',
            'line-width': 6,
            'line-opacity': 0.7
          }
        });

        // Add curve markers source
        map.addSource('curves', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
        });

        map.addLayer({
          id: 'curve-points',
          type: 'circle',
          source: 'curves',
          paint: {
            'circle-radius': 12,
            'circle-color': ['get', 'color'],
            'circle-stroke-width': 3,
            'circle-stroke-color': '#fff'
          }
        });

        map.addLayer({
          id: 'curve-labels',
          type: 'symbol',
          source: 'curves',
          layout: {
            'text-field': ['get', 'label'],
            'text-size': 12,
            'text-font': ['DIN Pro Bold', 'Arial Unicode MS Bold']
          },
          paint: {
            'text-color': '#fff'
          }
        });

        legend.classList.add('visible');
        showStatus('Tap Start to begin tracking');
      });
    }

    // Toggle tracking
    function toggleTracking() {
      if (isTracking) {
        stopTracking();
      } else {
        startTracking();
      }
    }

    // Start GPS tracking
    function startTracking() {
      if (!navigator.geolocation) {
        showStatus('Geolocation not supported');
        return;
      }

      // Reset state for fresh tracking session
      positionHistory = [];
      lastFetchPosition = null;
      lastFetchHeading = null;
      lastFetchTime = 0;
      upcomingCurves = [];
      lastSpokenCurve = null;

      showStatus('Acquiring GPS...');
      gpsAccuracy.style.display = 'flex';

      watchId = navigator.geolocation.watchPosition(
        handlePosition,
        handleError,
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );

      isTracking = true;
      startBtn.className = 'stop';
      startBtn.innerHTML = '<span>⏹</span> Stop';
    }

    // Stop tracking
    function stopTracking() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      isTracking = false;
      startBtn.className = 'start';
      startBtn.innerHTML = '<span>▶</span> Start';
      gpsAccuracy.style.display = 'none';
      hideStatus();
    }

    // Handle GPS position update
    async function handlePosition(position) {
      hideStatus();

      const { latitude, longitude, accuracy, heading, speed } = position.coords;
      currentPosition = [longitude, latitude];
      currentSpeed = speed ? Math.round(speed * 2.237) : 0; // m/s to MPH

      // Track position history for computing heading from movement
      const now = Date.now();
      positionHistory.push({ position: [longitude, latitude], time: now });
      if (positionHistory.length > POSITION_HISTORY_MAX) {
        positionHistory.shift();
      }

      // Compute heading: prefer movement-based heading over GPS heading
      // GPS heading is unreliable at low speeds
      const movementHeading = computeMovementHeading();
      if (movementHeading !== null && currentSpeed > 3) {
        currentHeading = movementHeading;
      } else if (heading !== null && heading !== undefined && !isNaN(heading)) {
        currentHeading = heading;
      }
      // Otherwise keep the last known heading (don't reset to 0)

      // Update accuracy indicator
      updateAccuracyIndicator(accuracy);

      // Update stats
      speedEl.textContent = currentSpeed;
      headingEl.textContent = getCompassDirection(currentHeading);

      // Update user marker
      updateUserMarker(currentPosition, currentHeading);

      // Center map ahead of user (so user appears in lower third, more road visible ahead)
      const offsetCenter = getPointAhead(currentPosition, currentHeading || 0, 0.15); // 150m ahead
      map.easeTo({
        center: offsetCenter,
        bearing: currentHeading || map.getBearing(),
        duration: 500
      });

      // Determine if we should re-fetch road data
      const shouldRefetch = needsRefetch(now);
      if (shouldRefetch) {
        await fetchRoadAhead();
        lastFetchPosition = [...currentPosition];
        lastFetchHeading = currentHeading;
        lastFetchTime = now;
      }

      // Update curve distances and check for callouts
      updateCurveDistances();
      checkForCallouts();
    }

    // Compute heading from recent position history (more reliable than GPS heading)
    function computeMovementHeading() {
      if (positionHistory.length < 3) return null;
      const recent = positionHistory[positionHistory.length - 1];
      const older = positionHistory[Math.max(0, positionHistory.length - 4)];
      const dist = getDistance(older.position, recent.position) * 1000;
      if (dist < 5) return null; // Not enough movement to determine heading
      return getBearing(older.position, recent.position);
    }

    // Determine if road data needs to be re-fetched
    function needsRefetch(now) {
      if (!lastFetchPosition) return true;
      const distMoved = getDistance(lastFetchPosition, currentPosition) * 1000;
      if (distMoved > REFETCH_DISTANCE_M) return true;
      if (lastFetchHeading !== null) {
        let headingDelta = Math.abs(currentHeading - lastFetchHeading);
        if (headingDelta > 180) headingDelta = 360 - headingDelta;
        if (headingDelta > REFETCH_HEADING_DEG) return true;
      }
      if (now - lastFetchTime > REFETCH_INTERVAL_MS) return true;
      return false;
    }

    // Update GPS accuracy indicator
    function updateAccuracyIndicator(accuracy) {
      accuracyText.textContent = `±${Math.round(accuracy)}m`;
      gpsDot.className = 'gps-dot ' + (accuracy < 10 ? 'good' : accuracy < 30 ? 'medium' : 'poor');
    }

    // Update user marker on map
    function updateUserMarker(coords, heading) {
      if (!userMarker) {
        const el = document.createElement('div');
        el.innerHTML = `
          <svg width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="18" fill="#3b82f6" stroke="white" stroke-width="3"/>
            <path d="M20 8 L26 28 L20 24 L14 28 Z" fill="white"/>
          </svg>
        `;
        el.style.width = '40px';
        el.style.height = '40px';
        userMarker = new mapboxgl.Marker({ element: el, rotationAlignment: 'map' })
          .setLngLat(coords)
          .addTo(map);
      } else {
        userMarker.setLngLat(coords);
        userMarker.setRotation(heading || 0);
      }
    }

    // Fetch road geometry ahead using Mapbox Directions
    async function fetchRoadAhead() {
      if (!currentPosition) return;

      const heading = currentHeading || 0;
      const aheadPoint = getPointAhead(currentPosition, heading, LOOK_AHEAD_KM);

      // Use a "behind" point to anchor the route to the correct road/direction
      let behindPoint = null;
      if (positionHistory.length >= 3) {
        for (let i = positionHistory.length - 3; i >= 0; i--) {
          const dist = getDistance(positionHistory[i].position, currentPosition) * 1000;
          if (dist > 30) {
            behindPoint = positionHistory[i].position;
            break;
          }
        }
      }
      if (!behindPoint) {
        const reverseHeading = (heading + 180) % 360;
        behindPoint = getPointAhead(currentPosition, reverseHeading, 0.05);
      }

      try {
        // 3 waypoints: behind → current → ahead (anchors to correct road)
        const coords = `${behindPoint[0]},${behindPoint[1]};${currentPosition[0]},${currentPosition[1]};${aheadPoint[0]},${aheadPoint[1]}`;
        const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${coords}?geometries=geojson&overview=full&access_token=${mapboxToken}`;

        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes[0]) {
          const fullRoute = data.routes[0].geometry.coordinates;

          // Find closest point on route to current position, keep only road ahead
          let closestIdx = 0;
          let closestDist = Infinity;
          for (let i = 0; i < fullRoute.length; i++) {
            const d = getDistance(currentPosition, fullRoute[i]);
            if (d < closestDist) {
              closestDist = d;
              closestIdx = i;
            }
          }

          routeCoordinates = fullRoute.slice(Math.max(0, closestIdx - 1));

          // Update route on map
          map.getSource('route').setData({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: routeCoordinates }
          });

          // Analyze curves
          analyzeCurves(routeCoordinates);
        }
      } catch (error) {
        console.error('Error fetching road data:', error);
      }
    }

    // Analyze road geometry for curves
    function analyzeCurves(coordinates) {
      upcomingCurves = [];
      lastSpokenCurve = null;

      if (coordinates.length < 3) return;

      const minAngleChange = 15; // degrees to count as a curve
      let i = 0;

      while (i < coordinates.length - 2) {
        // Look at segments of ~50m
        let segmentStart = i;
        let segmentEnd = i;

        // Find a segment of approximately 50-100m
        let segmentDistance = 0;
        while (segmentEnd < coordinates.length - 1 && segmentDistance < 100) {
          segmentDistance += getDistance(coordinates[segmentEnd], coordinates[segmentEnd + 1]) * 1000;
          segmentEnd++;
        }

        if (segmentEnd >= coordinates.length - 1) break;

        // Calculate bearing change over this segment
        const bearing1 = getBearing(coordinates[segmentStart], coordinates[Math.min(segmentStart + 2, coordinates.length - 1)]);
        const bearing2 = getBearing(coordinates[Math.max(segmentEnd - 2, 0)], coordinates[segmentEnd]);
        let angleChange = bearing2 - bearing1;

        // Normalize to -180 to 180
        while (angleChange > 180) angleChange -= 360;
        while (angleChange < -180) angleChange += 360;

        const absAngle = Math.abs(angleChange);

        if (absAngle >= minAngleChange) {
          // Rally pace notes: 1-6 scale (1=tightest, 6=fastest)
          // Hairpin is called separately for >150°
          let severity;
          let isHairpin = false;
          let isSquare = false;

          if (absAngle >= 150) {
            severity = 1;
            isHairpin = true;  // Hairpin - tighter than 1
          } else if (absAngle >= 110) {
            severity = 1;      // Very tight, first gear
          } else if (absAngle >= 85 && absAngle <= 95) {
            severity = 2;
            isSquare = true;   // Square corner (~90°)
          } else if (absAngle >= 80) {
            severity = 2;      // Tight
          } else if (absAngle >= 60) {
            severity = 3;      // Medium-tight
          } else if (absAngle >= 40) {
            severity = 4;      // Medium-open
          } else if (absAngle >= 25) {
            severity = 5;      // Fast
          } else {
            severity = 6;      // Very fast, nearly flat
          }

          const direction = angleChange > 0 ? 'right' : 'left';
          const dirShort = angleChange > 0 ? 'R' : 'L';
          const curvePointIdx = Math.floor((segmentStart + segmentEnd) / 2);
          const distanceFromStart = getRouteDistance(coordinates, 0, curvePointIdx);

          // Build the call in rally format: Direction first, then severity
          let call;
          if (isHairpin) {
            call = `${direction} hairpin`;
          } else if (isSquare) {
            call = `${direction} square`;
          } else {
            call = `${direction} ${severity}`;
          }

          upcomingCurves.push({
            position: coordinates[curvePointIdx],
            routeIndex: curvePointIdx,
            severity,
            direction: dirShort,
            angle: Math.round(absAngle),
            distanceFromStart,
            distance: Math.round(distanceFromStart),
            isHairpin,
            isSquare,
            call,
            description: getCurveDescription(severity, absAngle, isHairpin, isSquare)
          });
        }

        i = segmentEnd;
      }

      // Detect "tightens" and "opens" for consecutive curves
      detectCompoundCurves();

      // Update map markers
      updateCurveMarkers();
      curvesEl.textContent = upcomingCurves.length;
    }

    // Detect compound curves (tightens/opens)
    function detectCompoundCurves() {
      for (let i = 0; i < upcomingCurves.length - 1; i++) {
        const current = upcomingCurves[i];
        const next = upcomingCurves[i + 1];

        // If curves are close together and same direction
        const distBetween = Math.abs(current.distanceFromStart - next.distanceFromStart);
        if (distBetween < 150 && current.direction === next.direction) {
          const dir = current.direction === 'R' ? 'right' : 'left';
          if (next.severity < current.severity) {
            // Tightens: starts fast, gets tighter
            current.modifier = 'tightens';
            current.tightensTo = next.severity;
            current.call = `${dir} ${current.severity} tightens ${next.severity}`;
          } else if (next.severity > current.severity) {
            // Opens: starts tight, gets faster
            current.modifier = 'opens';
            current.opensTo = next.severity;
            current.call = `${dir} ${current.severity} opens ${next.severity}`;
          }
        }
      }
    }

    // Get curve description
    function getCurveDescription(severity, angle, isHairpin, isSquare) {
      if (isHairpin) return `Hairpin ${angle}° - very slow, may need handbrake`;
      if (isSquare) return `Square ${angle}° - 90° corner`;
      if (severity === 1) return `${angle}° - 1st gear, very tight`;
      if (severity === 2) return `${angle}° - 2nd gear, tight`;
      if (severity === 3) return `${angle}° - 3rd gear, medium`;
      if (severity === 4) return `${angle}° - 4th gear, open`;
      if (severity === 5) return `${angle}° - 5th gear, fast`;
      return `${angle}° - 6th gear, flat out`;
    }

    // Update curve markers on map
    function updateCurveMarkers() {
      const features = upcomingCurves.map(curve => {
        let label;
        if (curve.isHairpin) {
          label = `${curve.direction}H`;
        } else if (curve.isSquare) {
          label = `${curve.direction}SQ`;
        } else {
          label = `${curve.direction}${curve.severity}`;
        }

        return {
          type: 'Feature',
          geometry: { type: 'Point', coordinates: curve.position },
          properties: {
            label,
            color: curve.isHairpin ? '#dc2626' : getSeverityColor(curve.severity)
          }
        };
      });

      map.getSource('curves').setData({
        type: 'FeatureCollection',
        features
      });
    }

    // Get color for severity
    function getSeverityColor(severity) {
      const colors = {
        1: '#ef4444', 2: '#f97316', 3: '#eab308',
        4: '#84cc16', 5: '#22c55e', 6: '#34d399'
      };
      return colors[severity] || '#888';
    }

    // Update distances to curves using along-route distance
    function updateCurveDistances() {
      if (!currentPosition || upcomingCurves.length === 0 || routeCoordinates.length < 2) return;

      // Find closest point on route to current position
      let closestIdx = 0;
      let closestDist = Infinity;
      for (let i = 0; i < routeCoordinates.length; i++) {
        const d = getDistance(currentPosition, routeCoordinates[i]);
        if (d < closestDist) {
          closestDist = d;
          closestIdx = i;
        }
      }

      // Calculate along-route distance from our position to each curve
      upcomingCurves.forEach(curve => {
        if (curve.routeIndex > closestIdx) {
          curve.distance = Math.round(getRouteDistance(routeCoordinates, closestIdx, curve.routeIndex));
        } else {
          curve.distance = -Math.round(getRouteDistance(routeCoordinates, curve.routeIndex, closestIdx));
        }
      });

      // Sort by distance (nearest first)
      upcomingCurves.sort((a, b) => a.distance - b.distance);

      // Filter out passed curves
      upcomingCurves = upcomingCurves.filter(c => c.distance > -20);

      curvesEl.textContent = upcomingCurves.length;

      // Update UI
      updateUpcomingDisplay();
    }

    // Update upcoming curves display
    function updateUpcomingDisplay() {
      if (upcomingCurves.length === 0) {
        distanceEl.textContent = '—';
        callTextEl.textContent = 'Clear road ahead';
        callTextEl.className = '';
        callDescEl.textContent = '';
        upcomingEl.innerHTML = '';
        return;
      }

      const next = upcomingCurves[0];

      // Main display
      distanceEl.textContent = `${next.distance}m`;
      callTextEl.textContent = next.call;
      callTextEl.className = `severity-${next.severity}`;
      callDescEl.textContent = next.description;

      // Upcoming strip
      upcomingEl.innerHTML = upcomingCurves.slice(0, 5).map(curve => `
        <div class="upcoming-note">
          <div class="dist">${curve.distance}m</div>
          <div class="severity-${curve.severity}">${curve.call}</div>
        </div>
      `).join('');
    }

    // Check if we should call out a curve
    function checkForCallouts() {
      if (!soundEnabled || upcomingCurves.length === 0) return;

      const next = upcomingCurves[0];

      // Calculate callout distance based on speed AND severity
      // Tighter turns (lower severity number) need earlier warning
      // Reaction time in seconds based on severity:
      const reactionTime = {
        1: 5.0,  // Hairpin/very tight - need 5 seconds to prepare
        2: 4.5,  // Tight - 4.5 seconds
        3: 4.0,  // Medium-tight - 4 seconds
        4: 3.5,  // Medium-open - 3.5 seconds
        5: 3.0,  // Fast - 3 seconds
        6: 2.5   // Very fast - 2.5 seconds
      };

      // Convert speed (MPH) to m/s: mph * 0.447
      const speedMs = currentSpeed * 0.447;
      const severityReactionTime = reactionTime[next.severity] || 4;

      // Distance = speed * reaction time, with minimum of 60m
      const calloutDistance = Math.max(60, speedMs * severityReactionTime);

      if (next.distance <= calloutDistance && next.distance > 10) {
        if (lastSpokenCurve !== next) {
          speakCurve(next);
          lastSpokenCurve = next;
        }
      }
    }

    // Speak curve callout - Rally style: "direction severity [modifier]"
    function speakCurve(curve) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      const direction = curve.direction === 'L' ? 'left' : 'right';
      let text = '';

      // Build the call: Direction first, then severity
      if (curve.isHairpin) {
        text = `${direction} hairpin`;
      } else if (curve.isSquare) {
        text = `${direction} square`;
      } else if (curve.modifier === 'tightens') {
        text = `${direction} ${curve.severity} tightens ${curve.tightensTo}`;
      } else if (curve.modifier === 'opens') {
        text = `${direction} ${curve.severity} opens ${curve.opensTo}`;
      } else {
        text = `${direction} ${curve.severity}`;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.3;  // Slightly slower for clarity
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    // Toggle sound
    function toggleSound() {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
      soundBtn.classList.toggle('muted', !soundEnabled);

      if (!soundEnabled) {
        window.speechSynthesis?.cancel();
      }
    }

    // Toggle demo mode
    function toggleDemo() {
      if (isDemoMode) {
        stopDemo();
      } else {
        startDemo();
      }
    }

    // Start demo mode
    async function startDemo() {
      // Stop real tracking if active
      if (isTracking) {
        stopTracking();
      }

      const demoBtn = document.getElementById('demo-btn');
      demoBtn.classList.add('active');
      demoBtn.innerHTML = '<span>⏳</span> Loading...';

      showStatus('Fetching Pikes Peak route...');

      try {
        // Fetch real route from Mapbox Directions API
        const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${DEMO_START[0]},${DEMO_START[1]};${DEMO_END[0]},${DEMO_END[1]}?geometries=geojson&overview=full&access_token=${mapboxToken}`;
        const response = await fetch(url);
        const data = await response.json();

        if (!data.routes || !data.routes[0]) {
          throw new Error('No route found');
        }

        demoRouteData = data.routes[0].geometry.coordinates;

        if (demoRouteData.length < 10) {
          throw new Error('Route too short');
        }

      } catch (error) {
        console.error('Error fetching demo route:', error);
        showStatus('Error loading route');
        demoBtn.classList.remove('active');
        demoBtn.innerHTML = '<span>🎬</span> Demo';
        setTimeout(hideStatus, 2000);
        return;
      }

      isDemoMode = true;
      demoIndex = 0;
      positionHistory = [];
      demoBtn.innerHTML = '<span>⏹</span> Stop Demo';

      // Show GPS indicator for demo
      gpsAccuracy.style.display = 'flex';
      accuracyText.textContent = 'DEMO';
      gpsDot.className = 'gps-dot good';

      // Set initial position and center map
      currentPosition = demoRouteData[0];
      routeCoordinates = demoRouteData;

      // Update route on map
      map.getSource('route').setData({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: demoRouteData }
      });

      // Analyze curves in demo route
      analyzeCurves(demoRouteData);

      // Center map ahead of start (so user appears in lower third)
      const startBearing = getBearing(demoRouteData[0], demoRouteData[1]);
      const offsetStart = getPointAhead(demoRouteData[0], startBearing, 0.15);
      map.flyTo({
        center: offsetStart,
        zoom: 17,
        pitch: 70,
        bearing: startBearing
      });

      // Start simulation loop (update every 200ms for smooth animation)
      demoInterval = setInterval(simulateDemoMovement, 200);
      showStatus('Demo: Pikes Peak Hill Climb');
      setTimeout(hideStatus, 2000);
    }

    // Stop demo mode
    function stopDemo() {
      isDemoMode = false;
      if (demoInterval) {
        clearInterval(demoInterval);
        demoInterval = null;
      }

      const demoBtn = document.getElementById('demo-btn');
      demoBtn.classList.remove('active');
      demoBtn.innerHTML = '<span>🎬</span> Demo';
      gpsAccuracy.style.display = 'none';

      // Reset display
      distanceEl.textContent = '—';
      callTextEl.textContent = 'Demo stopped';
      callTextEl.className = '';
      callDescEl.textContent = '';
      upcomingEl.innerHTML = '';
      speedEl.textContent = '0';
      curvesEl.textContent = '0';
    }

    // Simulate movement along demo route
    function simulateDemoMovement() {
      if (!isDemoMode || demoRouteData.length === 0) return;

      if (demoIndex >= demoRouteData.length - 1) {
        // Loop back to start
        demoIndex = 0;
        lastSpokenCurve = null;
        positionHistory = [];
        analyzeCurves(demoRouteData);
        return;
      }

      // Move to next point
      demoIndex++;
      currentPosition = demoRouteData[demoIndex];

      // Track position history for demo too
      positionHistory.push({ position: [...currentPosition], time: Date.now() });
      if (positionHistory.length > POSITION_HISTORY_MAX) {
        positionHistory.shift();
      }

      // Calculate heading to next point
      if (demoIndex < demoRouteData.length - 1) {
        currentHeading = getBearing(demoRouteData[demoIndex], demoRouteData[demoIndex + 1]);
      }

      // Simulate speed (vary based on curve severity) - in MPH
      const nearestCurve = upcomingCurves[0];
      if (nearestCurve && nearestCurve.distance < 100) {
        // Slow down for curves
        demoSpeed = Math.max(20, 45 - (6 - nearestCurve.severity) * 6);
      } else {
        demoSpeed = 45;
      }
      currentSpeed = demoSpeed;

      // Update UI
      speedEl.textContent = currentSpeed;
      headingEl.textContent = getCompassDirection(currentHeading);

      // Update user marker
      updateUserMarker(currentPosition, currentHeading);

      // Center map ahead of user (so user appears in lower third)
      const offsetCenter = getPointAhead(currentPosition, currentHeading, 0.15);
      map.easeTo({
        center: offsetCenter,
        bearing: currentHeading,
        duration: 200
      });

      // Update curve distances and check for callouts
      updateCurveDistances();
      checkForCallouts();
    }

    // Center map on user
    function centerOnUser() {
      if (currentPosition) {
        const offsetCenter = getPointAhead(currentPosition, currentHeading || 0, 0.15);
        map.flyTo({
          center: offsetCenter,
          zoom: 17,
          pitch: 70,
          bearing: currentHeading || 0
        });
      }
    }

    // Handle GPS error
    function handleError(error) {
      let message = 'GPS Error';
      switch (error.code) {
        case 1: message = 'Location access denied'; break;
        case 2: message = 'Position unavailable'; break;
        case 3: message = 'GPS timeout'; break;
      }
      showStatus(message);
    }

    // Show/hide status
    function showStatus(text) {
      statusText.textContent = text;
      statusEl.classList.add('visible');
    }

    function hideStatus() {
      statusEl.classList.remove('visible');
    }

    // Utility functions
    function getDistance(coord1, coord2) {
      // Haversine formula, returns km
      const R = 6371;
      const dLat = toRad(coord2[1] - coord1[1]);
      const dLon = toRad(coord2[0] - coord1[0]);
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(toRad(coord1[1])) * Math.cos(toRad(coord2[1])) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function getRouteDistance(coords, startIdx, endIdx) {
      let dist = 0;
      for (let i = startIdx; i < endIdx && i < coords.length - 1; i++) {
        dist += getDistance(coords[i], coords[i + 1]);
      }
      return dist * 1000; // return meters
    }

    function getBearing(coord1, coord2) {
      const dLon = toRad(coord2[0] - coord1[0]);
      const lat1 = toRad(coord1[1]);
      const lat2 = toRad(coord2[1]);
      const y = Math.sin(dLon) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function getPointAhead(coord, bearing, distanceKm) {
      const R = 6371;
      const d = distanceKm / R;
      const brng = toRad(bearing);
      const lat1 = toRad(coord[1]);
      const lon1 = toRad(coord[0]);

      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
      const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));

      return [toDeg(lon2), toDeg(lat2)];
    }

    function getCompassDirection(heading) {
      const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return directions[Math.round(heading / 45) % 8];
    }

    function toRad(deg) { return deg * Math.PI / 180; }
    function toDeg(rad) { return rad * 180 / Math.PI; }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', checkSavedKey);
  </script>
</body>
